<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Toolwright social preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Geist+Mono:wght@400;500&family=Instrument+Sans:wght@400;600&display=block" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* GitHub social preview: 1280x640. Margin 64px. */
  body { width: 1280px; height: 640px; }
  header { position: absolute; left: 64px; right: 64px; top: 44px; height: 64px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand svg { width: 56px; height: 59px; }
  .brand .wordmark { font-size: 44px; }
  header .label { font-size: 22px; }
  .rule { position: absolute; left: 64px; right: 64px; top: 128px; height: 2px; background: var(--ink); }
  h1 { position: absolute; left: 64px; top: 182px; font-size: 108px; }
  h1 span.line { display: block; }
  h1 span.line + span.line { margin-top: 14px; }
  p.body { position: absolute; left: 64px; top: 432px; font-size: 30px; line-height: 1.35; width: 1100px; }
  /* Grid break: the ruler runs the full width, edge to edge. */
  .ruler { position: absolute; left: 0; right: 0; top: 512px; }
  .ruler .label { right: 64px; font-size: 22px; }
  footer { position: absolute; left: 64px; right: 64px; bottom: 34px; display: flex; justify-content: space-between; align-items: baseline; }
  footer .site { font-family: var(--mono); font-size: 26px; font-weight: 500; color: var(--ink); }
  footer .label { font-size: 22px; text-transform: none; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <header>
    <div class="brand">
      <svg viewBox="2 2 28 29.5" aria-hidden="true">
        <rect x="2" y="2" width="28" height="25" fill="#1B1A15"/>
        <rect x="11" y="2" width="10" height="11" fill="#F4F0E6"/>
        <circle cx="16" cy="20" r="3.2" fill="#F4F0E6"/>
        <rect x="2" y="28.5" width="28" height="3" fill="#D8EC4E"/>
      </svg>
      <span class="wordmark">Toolwright</span>
    </div>
    <span class="label">Open source / MIT license</span>
  </header>
  <div class="rule"></div>

  <h1 class="display">
    <span class="line">Do the job.</span>
    <span class="line"><span class="marker">Keep the data.</span></span>
  </h1>

  <p class="body">138 free tools for PDFs, images, code and text. Nothing is uploaded.</p>

  <div class="ruler">
    <svg preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="minor" width="10" height="32" patternUnits="userSpaceOnUse"><path d="M0.5 0V8" stroke="#1B1A15" stroke-width="1" fill="none"/></pattern>
        <pattern id="major" width="50" height="32" patternUnits="userSpaceOnUse"><path d="M0.5 0V16" stroke="#1B1A15" stroke-width="1.5" fill="none"/></pattern>
      </defs>
      <rect width="100%" height="32" fill="url(#minor)"/>
      <rect width="100%" height="32" fill="url(#major)"/>
      <path d="M0 0.75H10000" stroke="#1B1A15" stroke-width="1.5"/>
    </svg>
    <span class="label">138 tools</span>
  </div>

  <footer>
    <span class="site">toolwright.com</span>
    <span class="label">github.com/RaydanAridiCS/toolwright</span>
  </footer>
</body>
</html>
