<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Toolwright</title>
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9f9fe; color: #14142b; }
      main { max-width: 28rem; text-align: center; }
      h1 { margin: 0 0 8px; font-size: 1.75rem; }
      p { margin: 0 0 20px; line-height: 1.6; color: #565675; }
      a { display: inline-block; padding: 10px 20px; border-radius: 10px; background: #4338ca; color: #fff; text-decoration: none; font-weight: 600; }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a18; color: #ececf8; }
        p { color: #a0a0c6; }
        a { background: #8b93ff; color: #0a0a18; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You&rsquo;re offline</h1>
      <p>This page hasn&rsquo;t been saved for offline use yet. Tools you&rsquo;ve already opened keep working without a connection.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
