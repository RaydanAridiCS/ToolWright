name: Bug report
description: Something in a tool or on the site isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **Please don't paste private data** (real passwords, tokens, documents). A small made-up example is best.
        Found a privacy or security problem? Use the private reporting link in SECURITY.md instead of this form.
  - type: input
    id: tool
    attributes:
      label: Which tool or page?
      placeholder: e.g. /tools/merge-pdf
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: What did you do?
      description: Steps to reproduce, with example input if possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Firefox 140 on Windows 11
  - type: textarea
    id: console
    attributes:
      label: Console errors (optional)
      render: text
